kind = "web"
previewPath = "/"
title = "Football AI Creator"
description = "Football video studio for turning a match idea into a real downloadable MP4 using locally generated scenes, offline narration, synthesized music, and FFmpeg."
version = "1.0.0"
id = "artifacts/football-ai-creator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24239

[services.development]
run = "pnpm --filter @workspace/football-ai-creator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/football-ai-creator", "run", "build" ]
serve = "static"
publicDir = "artifacts/football-ai-creator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24239"
BASE_PATH = "/"
